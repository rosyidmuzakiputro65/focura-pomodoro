include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
    - _backup_sebelum_revisi/**
    - .widget_preview/**

linter:
  rules:
    prefer_const_constructors: true
    prefer_final_locals: true
    avoid_print: true
