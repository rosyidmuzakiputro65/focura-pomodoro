# Membangun Focura versi web dan menerbitkannya ke GitHub Pages
# setiap kali ada push ke branch main.
# Link hasilnya: https://<username>.github.io/<nama-repo>/
#
# Sekali saja: buka repo di GitHub -> Settings -> Pages ->
# "Build and deployment" -> Source: GitHub Actions.
name: Deploy web ke GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.5
          cache: true

      - name: Siapkan konfigurasi Firebase dari secret
        env:
          FIREBASE_CONFIG_JSON: ${{ secrets.FIREBASE_CONFIG_JSON }}
        run: |
          if [ -n "$FIREBASE_CONFIG_JSON" ]; then
            printf '%s' "$FIREBASE_CONFIG_JSON" > firebase_config.json
          else
            echo "Secret FIREBASE_CONFIG_JSON belum ada -> mode database lokal"
            cp firebase_config.example.json firebase_config.json
          fi

      - name: Ambil dependensi
        run: flutter pub get

      - name: Analisis & tes
        run: |
          flutter analyze
          flutter test

      - name: Build web
        run: flutter build web --release --base-href "/${{ github.event.repository.name }}/" --dart-define-from-file=firebase_config.json

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
